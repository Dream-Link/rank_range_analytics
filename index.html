<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e2e">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream-Link Rank</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
 
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --primary: #0f172a;
            --accent: #2563eb;
            --text: #1e293b;
            --secondary: #64748b;
            --border: #e2e8f0;
            --male-bg: #eff6ff;
            --female-bg: #fdf2f8;
            --tsp-text: #94a3b8;
        }

        [data-theme="dark"] {
            --bg: #020617;
            --card: #0f172a;
            --text: #f1f5f9;
            --border: #1e293b;
            --male-bg: rgba(37, 99, 235, 0.1);
            --female-bg: rgba(236, 72, 153, 0.1);
            --tsp-text: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            transition: background 0.3s;
        }


        .brand-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand {
            font-size: 1.4rem;
            font-weight: 900;
            color: #2563eb;
            letter-spacing: -0.5px;
        }

        .brand-sub {
            display: flex;
            flex-direction: column;
            font-size: 8px;
            font-weight: 800;
            line-height: 1;
            text-transform: uppercase;
            color: #94a3b8;
            animation: slowBlink 2.5s ease-in-out infinite;
        }

        @keyframes slowBlink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .header {
            background: var(--card);
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            display: grid;
            place-items: center;
        }

        .container {
            width: 100%;
            max-width: 100%;
            padding: 0;
        }

        .setup-section {
            background: var(--card);
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            margin-bottom: 10px;
        }

        .input-group {
            flex: 1;
        }

        .input-group.narrow {
            flex: 0 0 100px;
        }

        .input-label {
            font-size: 10px;
            font-weight: 800;
            color: var(--secondary);
            margin-bottom: 5px;
            display: block;
            text-transform: uppercase;
        }

        .input-box {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 8px 10px;
            border-radius: 8px;
            width: 100%;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            font-weight: 600;
            height: 40px;
        }

        .btn-action {
            width: 100%;
            background: var(--accent);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }

        .btn-action:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .home-links {
            padding: 30px 20px;
            text-align: center;
        }

        .link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            background: #D1CFCF;
            color: #363434;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.2);


            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            white-space: nowrap;
        }

        .report-section {
            background: var(--card);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th {
            font-size: 9px;

            padding: 6px 2px;

            color: var(--secondary);
            font-weight: 800;
            background: var(--bg);
            border-bottom: 2px solid var(--border);
            text-transform: uppercase;
        }

        td {
            padding: 6px 2px;

            text-align: center;
            border-bottom: 1px solid var(--border);
            font-size: 11px;

            word-break: break-all;

        }


        .cat-pill {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 1px 4px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 800;
        }

        .col-m {
            background-color: var(--male-bg);
            font-weight: 700;
            color: #2563eb;
        }

        .col-f {
            background-color: var(--female-bg);
            font-weight: 700;
            color: #db2777;
        }


        .summary-wrapper {
            margin-top: 30px;
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }


        .summary-header-row td {
            background: #2563eb !important;
            color: white !important;
            font-weight: 800 !important;
            font-size: 13px !important;
            padding: 10px 4px !important;
            border: none !important;
            text-transform: uppercase;
        }


        .global-sub-row td {
            padding: 8px 4px !important;
            font-size: 11px !important;
            font-weight: 700;
            color: var(--secondary);
            border-bottom: 1px solid var(--border);
            background: var(--bg);
        }

        .global-sub-row:last-child td {
            border-bottom: none;
        }

        .global-sub-icon {
            margin-right: 6px;
            font-size: 10px;
            color: var(--accent);
            opacity: 0.7;
        }

        #data-status-msg {
            font-size: 12px;
            font-weight: 700;
            color: #ef4444;
            background: #fef2f2;
            border: 1px solid #fee2e2;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: center;
            display: none;
        }


        #print-header {
            display: none;
            text-align: center;
            padding: 15px 0;
            margin-bottom: 15px;
            border-bottom: 2px solid #000;
        }

        #print-title {
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        #print-subtitle {
            font-size: 12px;
            font-weight: 700;
        }

        #print-info {
            font-size: 11px;
            font-weight: 600;
            margin-top: 5px;
            color: #444;
        }

        @media print {

            .header,
            .setup-section,
            .home-links,
            .nav-actions {
                display: none !important;
            }

            #print-header {
                display: block !important;
            }

            body {
                background: white;
                color: black;
            }

            .report-section {
                display: block !important;
            }

            table {
                width: 100% !important;
                border: 1px solid #000;
            }

            th,
            td {
                border: 1px solid #000 !important;
                color: black !important;
                padding: 8px 4px !important;
            }

            .col-m,
            .col-f {
                background: transparent !important;
                color: black !important;
            }

            .grand-total-row td {
                background: #eee !important;
                color: black !important;
            }
        }

        #loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .status-table-container {
            margin-top: 10px;
            padding: 0;

            width: 100%;
            animation: fadeIn 0.8s ease;
        }

        .status-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);

            overflow: hidden;
            font-size: 12px;
        }

        .status-table th {
            background: var(--bg);
            color: var(--secondary);
            font-weight: 700;
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }

        .status-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            color: var(--tsp-text);
        }

        .status-table tr:last-child td {
            border-bottom: none;
        }

        .status-table .exam-name {
            text-align: left;
            font-weight: 600;
            color: var(--text);
            padding-left: 15px;
        }

        .check-icon {
            color: #22c55e;
            font-weight: bold;
        }

        .cross-icon {
            color: #cbd5e1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s ease-out;
        }

        .modal-card {
            background: var(--card);
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
        }

        .modal-header h3 {
            font-size: 16px;
            font-weight: 800;
            margin: 0;
        }

        .modal-body {
            max-height: 60vh;
            overflow-y: auto;
            padding: 10px;
        }

        .saved-item {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .saved-info {
            flex: 1;
            cursor: pointer;
        }

        .saved-title {
            font-weight: 800;
            font-size: 12px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .saved-meta {
            font-size: 10px;
            color: var(--secondary);
            margin-top: 2px;
            font-weight: 600;
        }

        .delete-btn {
            background: #fee2e2;
            color: #ef4444;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            cursor: pointer;
            margin-left: 10px;
            transition: 0.2s;
        }

        .delete-btn:hover {
            background: #ef4444;
            color: white;
        }
    </style>
</head>

<body data-theme="light">

    <script>
        const examStatusData = [{
                id: 'vdo2025',
                name: 'VDO 2025',
                ntsp: true,
                tsp: true
            },
            {
                id: 'patwar2025',
                name: 'Patwar 2025',
                ntsp: true,
                tsp: true
            },
            {
                id: 'fourthclass',
                name: 'Fourth Class',
                ntsp: false,
                tsp: false
            }
        ];

        function loadStatusTable() {
            const tbody = document.getElementById('status-table-body');
            let html = '';

            examStatusData.forEach(item => {
                if (item.id === 'fourthclass') {
                    html += `
                    <tr>
                        <td colspan="3" style="padding: 12px; text-align: center; font-weight: 700;">
                            <a href="https://rssb.rajasthan.gov.in/results" target="_blank" style="text-decoration: none; color: var(--accent); display: block; width: 100%;">
                                <i class="fas fa-external-link-alt"></i> Fourth Class भर्ती के लिए यहाँ क्लिक करें
                            </a>
                        </td>
                    </tr>`;
                } else {
                    html += `
                    <tr>
                        <td class="exam-name">${item.name}</td>
                        <td>${item.ntsp ? '<i class="fas fa-check-circle check-icon"></i>' : '<i class="fas fa-times cross-icon"></i>'}</td>
                        <td>${item.tsp ? '<i class="fas fa-check-circle check-icon"></i>' : '<i class="fas fa-times cross-icon"></i>'}</td>
                    </tr>`;
                }
            });
            tbody.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', loadStatusTable);

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            const target = current === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', target);
            document.querySelector('#theme-toggle i').className = target === 'light' ? 'fas fa-moon' : 'fas fa-sun';
        }

       function checkServerData() {
            document.getElementById('data-status-msg').style.display = 'none';
            document.getElementById('gen-btn').disabled = false;
            document.getElementById('main-table-container').style.display = 'none';
            document.getElementById('home-intro').style.display = 'block';

            const examSelect = document.getElementById('exam-select');
            const regionGroup = document.getElementById('region-select').closest('.input-group');
            const rankGroup = document.getElementById('rank-start').closest('.input-group');
            const analyzeBtn = document.getElementById('gen-btn');

            if (examSelect.value === 'fourthclass') {
                regionGroup.style.display = 'none';
                rankGroup.style.display = 'none';
                analyzeBtn.innerHTML = '<i class="fas fa-external-link-alt"></i> OPEN LINK';
            } else {
                regionGroup.style.display = 'block';
                rankGroup.style.display = 'block';
                analyzeBtn.innerHTML = '<i class="fas fa-bolt"></i> ANALYZE';
            }
        }
        

let loadedExamCache = {};

function fetchAndAnalyze() {
    const examEl = document.getElementById('exam-select');
    const regionEl = document.getElementById('region-select');
    
    if (examEl.value === 'fourthclass') {
        window.open('https://google.com', '_blank');
        return;
    }

    const startInput = document.getElementById('rank-start').value;
    const endInput = document.getElementById('rank-end').value;

    const examId = examEl.value; 
    const regionKey = regionEl.value;

    if (!startInput || !endInput) return alert("कृपया रैंक रेंज डालें!");
    const start = parseInt(startInput);
    const end = parseInt(endInput);
    if (end < start) return alert("End Rank, Start Rank से बड़ी होनी चाहिए!");

    document.getElementById('loading-overlay').style.display = 'flex';
    document.getElementById('print-info').innerText = `Exam: ${examEl.options[examEl.selectedIndex].text} | Area: ${regionEl.options[regionEl.selectedIndex].text} | Range: ${start} to ${end}`;

    const isTspRegion = (regionKey === 'tsp');

    let headHTML = `<tr><th style="text-align: left; padding-left: 15px;">CATEGORY</th><th>MALE</th><th>FEMALE</th><th>OTHER</th>`;
    if (!isTspRegion) headHTML += `<th>TSP</th>`;
    headHTML += `<th>TOTAL</th></tr>`;
    document.getElementById('table-head').innerHTML = headHTML;

    if (window[examId]) {
        console.log("Data already loaded via Cache");
        runAnalysis(window[examId], regionKey, start, end, isTspRegion);
        return;
    }

    console.log(`Loading Script: ${examId}.js`);
    const script = document.createElement('script');
    script.src = `${examId}.js`;
    
    script.onload = function() {
        if (window[examId]) {
            runAnalysis(window[examId], regionKey, start, end, isTspRegion);
        } else {
            alert("Error: File load ho gayi par data nahi mila. Check spelling in JS file.");
            document.getElementById('loading-overlay').style.display = 'none';
        }
    };

    script.onerror = function() {
        alert(`Error: ${examId}.js file nahi mili! Folder check karein.`);
        document.getElementById('loading-overlay').style.display = 'none';
    };

    document.body.appendChild(script);
}

function runAnalysis(examData, regionKey, start, end, isTspRegion) {
    try {
        const regionData = examData[regionKey] || {};
        const filteredData = [];

        Object.keys(regionData).forEach(rankKey => {
            const rank = parseInt(rankKey);
            if (rank >= start && rank <= end) {
                filteredData.push({ ...regionData[rankKey], Rank: rank });
            }
        });

        document.getElementById('home-intro').style.display = 'none';
        document.getElementById('main-table-container').style.display = 'block';

        if (filteredData.length === 0) {
            alert("इस रैंक रेंज में कोई डेटा नहीं मिला!");
        }

        processRecords(filteredData, isTspRegion);

    } catch (e) {
        console.error(e);
        alert("Error processing data: " + e.message);
    }
    document.getElementById('loading-overlay').style.display = 'none';
}

        function processRecords(records, isTspRegion) {
            const cats = ['GEN', 'OBC', 'EWS', 'MBC', 'SC', 'ST', 'SAH'];
            const matrix = {};

            cats.forEach(c => matrix[c] = {
                m: 0,
                f: 0,
                o: 0,
                tsp: 0,
                t: 0,
                subs: {}
            });

            let grand = {
                m: 0,
                f: 0,
                o: 0,
                tsp: 0,
                t: 0
            };
            let grandSubs = {};

            records.forEach(item => {
                let cat = (item.Category || '').toUpperCase();
                let key = cats.find(k => cat.includes(k) || (k === 'GEN' && cat === 'UR'));

                if (key) {
                    const g = (item.Gender || '').toUpperCase();
                    const isTSP = (item.TSP === 'YES' || item.TSP === 'TSP');

                    if (g === 'MALE') {
                        matrix[key].m++;
                        grand.m++;
                    } else if (g === 'FEMALE') {
                        matrix[key].f++;
                        grand.f++;
                    } else {
                        matrix[key].o++;
                        grand.o++;
                    }

                    if (!isTspRegion && isTSP) {
                        matrix[key].tsp++;
                        grand.tsp++;
                    }
                    matrix[key].t++;
                    grand.t++;

                    const s = item.SubCat || '-';
                    if (s !== '-') {
                        if (!matrix[key].subs[s]) matrix[key].subs[s] = {
                            m: 0,
                            f: 0,
                            o: 0,
                            tsp: 0,
                            t: 0
                        };

                        if (g === 'MALE') matrix[key].subs[s].m++;
                        else if (g === 'FEMALE') matrix[key].subs[s].f++;
                        else matrix[key].subs[s].o++;

                        if (!isTspRegion && isTSP) matrix[key].subs[s].tsp++;
                        matrix[key].subs[s].t++;

                        if (!grandSubs[s]) grandSubs[s] = {
                            m: 0,
                            f: 0,
                            o: 0,
                            tsp: 0,
                            t: 0
                        };

                        if (g === 'MALE') grandSubs[s].m++;
                        else if (g === 'FEMALE') grandSubs[s].f++;
                        else grandSubs[s].o++;

                        if (!isTspRegion && isTSP) grandSubs[s].tsp++;
                        grandSubs[s].t++;
                    }
                }
            });

            render(matrix, grand, grandSubs, isTspRegion);
        }

        function render(matrix, grand, grandSubs, isTspRegion) {
            let html = '';

            Object.entries(matrix).forEach(([name, d]) => {
                html += `
                    <tr>
                        <td style="text-align:left; padding-left:15px;">
                            <span class="cat-pill">${name}</span>
                        </td>
                        <td class="col-m">${d.m}</td>
                        <td class="col-f">${d.f}</td>
                        <td>${d.o}</td>
                        ${!isTspRegion ? `<td style="color:var(--tsp-text)">${d.tsp}</td>` : ''}
                        <td style="font-weight:800">${d.t}</td>
                    </tr>
                `;

                const subKeys = Object.keys(d.subs);
                if (subKeys.length > 0) {
                    subKeys.forEach(subName => {
                        const subData = d.subs[subName];
                        html += `
                            <tr class="sub-row">
                                <td class="sub-name-cell">
                                   <i class="fas fa-level-up-alt fa-rotate-90 sub-arrow"></i> ${subName}
                                </td>
                                <td>${subData.m}</td>
                                <td>${subData.f}</td>
                                <td>${subData.o}</td>
                                ${!isTspRegion ? `<td>${subData.tsp}</td>` : ''}
                                <td style="font-weight:700; color:var(--text);">${subData.t}</td>
                            </tr>
                        `;
                    });
                }
            });
            document.getElementById('pivot-body').innerHTML = html;

            document.getElementById('pivot-footer').innerHTML = '';


            let summaryHTML = `<table style="width:100%; border-collapse:collapse; text-align:center;">`;

            summaryHTML += `
                <tr class="summary-header-row">
                    <td style="text-align:left; padding-left:20px !important;">TOTAL</td>
                    <td>${grand.m}</td>
                    <td>${grand.f}</td>
                    <td>${grand.o}</td>
                    ${!isTspRegion ? `<td>${grand.tsp}</td>` : ''}
                    <td>${grand.t}</td>
                </tr>
            `;

            if (grandSubs) {
                Object.keys(grandSubs).sort().forEach(subName => {
                    const d = grandSubs[subName];
                    summaryHTML += `
                        <tr class="global-sub-row">
                            <td style="text-align:left; padding-left:25px !important;">
                               <i class="fas fa-layer-group global-sub-icon"></i> ${subName}
                            </td>
                            <td style="color:#2563eb;">${d.m}</td>
                            <td style="color:#db2777;">${d.f}</td>
                            <td>${d.o}</td>
                            ${!isTspRegion ? `<td style="color:var(--tsp-text);">${d.tsp}</td>` : ''}
                            <td style="color:var(--text); font-weight:900;">${d.t}</td>
                        </tr>
                    `;
                });
            }
            summaryHTML += `</table>`;

            const summaryWrapper = document.getElementById('summary-wrapper');
            summaryWrapper.innerHTML = summaryHTML;
            summaryWrapper.style.display = 'block';
        }

        function saveReportToLocal() {
            const exam = document.getElementById('exam-select').value;
            const region = document.getElementById('region-select').value;
            const start = document.getElementById('rank-start').value;
            const end = document.getElementById('rank-end').value;

            if (!start || !end) {
                alert("Please enter a Rank Range first!");
                return;
            }

            const report = {
                id: Date.now(),
                exam: exam,
                region: region,
                start: start,
                end: end,
                date: new Date().toLocaleDateString()
            };

            let saved = JSON.parse(localStorage.getItem('dl_saved_reports') || '[]');

            const exists = saved.some(r => r.exam === exam && r.region === region && r.start === start && r.end === end);
            if (exists) {
                alert("This report is already saved!");
                return;
            }

            saved.unshift(report);
            localStorage.setItem('dl_saved_reports', JSON.stringify(saved));

            const btn = event.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i>';
            setTimeout(() => btn.innerHTML = originalHTML, 1500);
        }

        function toggleSavedModal() {
            const modal = document.getElementById('saved-modal');
            if (modal.style.display === 'none') {
                renderSavedList();
                modal.style.display = 'flex';
            } else {
                modal.style.display = 'none';
            }
        }

        function renderSavedList() {
            const container = document.getElementById('saved-list-container');
            const saved = JSON.parse(localStorage.getItem('dl_saved_reports') || '[]');

            if (saved.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--secondary); font-size:12px;">No saved reports found.</div>';
                return;
            }

            let html = '';
            saved.forEach((item, index) => {
                const examName = document.querySelector(`#exam-select option[value="${item.exam}"]`)?.text || item.exam;
                const regionName = item.region.toUpperCase();

                html += `
                    <div class="saved-item">
                        <div class="saved-info" onclick="loadAndRunReport(${index})">
                            <div class="saved-title">${examName} (${regionName})</div>
                            <div class="saved-meta">Rank: ${item.start} - ${item.end} • ${item.date}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteReport(${index})">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function loadAndRunReport(index) {
            const saved = JSON.parse(localStorage.getItem('dl_saved_reports') || '[]');
            const item = saved[index];

            if (item) {
                document.getElementById('exam-select').value = item.exam;
                document.getElementById('region-select').value = item.region;
                document.getElementById('rank-start').value = item.start;
                document.getElementById('rank-end').value = item.end;

                toggleSavedModal();

                checkServerData();
                fetchAndAnalyze();
            }
        }

        function deleteReport(index) {
            if (!confirm("Delete this saved record?")) return;

            let saved = JSON.parse(localStorage.getItem('dl_saved_reports') || '[]');
            saved.splice(index, 1);
            localStorage.setItem('dl_saved_reports', JSON.stringify(saved));

            renderSavedList();
        }
        checkServerData();
    </script>
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
    </script>
</body>

</html>
